description: >-
  Brinker International is a leading casual dining restaurant company that owns,
  operates, and franchises Chili's Grill & Bar and Maggiano's Little Italy.
  Headquartered in Dallas, Texas, Brinker operates over 1,600 Chili's locations
  across 29 countries and over 50 Maggiano's locations in the United States.
  The company leverages digital ordering platforms, loyalty programs, mobile
  apps, in-restaurant kiosks, and point-of-sale integrations for restaurant
  operations, running a unified open-source e-commerce environment built on
  Red Hat (RHEL, Satellite, Lightspeed) and using Prismic CMS for digital
  content management. Brinker runs a real but entirely partner-facing API program
  on Google Apigee: an Apigee Edge gateway at api.brinker.com and an Apigee
  Integrated Developer Portal at developer.brinker.com whose API catalog is
  approval-gated (accounts are approved by the Brinker API Team and API Products
  assigned by entitlement). The portal's anonymous catalog endpoint returns an
  empty apiDocs/apiProducts list; its QA sibling names six API product families —
  LoyaltyEA, Promos, ITSM ServiceNow, GMS, OrderManagement and POS — but exposes
  no paths, schemas or base URLs. There is no public, self-service developer API,
  OpenAPI specification, SDK, MCP server, agent card, or open GitHub organization.
  Consumer-facing surfaces are the Chili's and Maggiano's mobile apps and websites
  and their loyalty programs, with online ordering powered by Olo and site content
  by Prismic.
